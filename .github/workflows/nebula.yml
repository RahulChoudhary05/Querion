# Nebula — the free-forever automation for Querion.
# GitHub Actions cron (free for public repos; 2,000 min/month on private) runs the
# agent directly against your hosted Postgres (Neon free tier), so it works even
# while a free web host (Render/Koyeb) is asleep.
#
# Required repository secrets:
#   DATABASE_URL            Neon / Supabase connection string
#   GROQ_API_KEY            and/or GEMINI_API_KEY (free tiers)
#   KAGGLE_USERNAME, KAGGLE_KEY
# Optional: RESEND_API_KEY, MAIL_FROM, APP_URL, JWT_SECRET (for unsubscribe links)

name: Nebula

on:
  schedule:
    - cron: '5 0 * * *' # daily problem — 00:05 UTC
    - cron: '0 18 * * 0' # weekly agent — Sunday 18:00 UTC (pack for next Monday)
  workflow_dispatch:
    inputs:
      job:
        description: 'daily | weekly | scout'
        default: weekly

concurrency: nebula

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NODE_ENV: production
      DB_DRIVER: postgres
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_DISCOVER: ${{ secrets.KAGGLE_DISCOVER }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      APP_URL: ${{ secrets.APP_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-only-secret-not-used-for-auth-0000' }}
      SCHEDULER_ENABLED: 'false'
    steps:
      # Fail fast with an actionable message: a missing secret reaches the job as an empty string,
      # which otherwise only surfaces a minute later as "DB_DRIVER=postgres requires DATABASE_URL".
      - name: Check required secrets
        run: |
          missing=0
          if [ -z "$DATABASE_URL" ]; then
            echo "::error title=Missing secret DATABASE_URL::Add your Neon/Supabase Postgres connection string as a REPOSITORY secret named DATABASE_URL (Settings → Secrets and variables → Actions → Repository secrets → New repository secret). Environment secrets (e.g. 'Production') are not visible to this job."
            missing=1
          fi
          if [ -z "$GROQ_API_KEY" ] && [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning title=No AI key::Neither GROQ_API_KEY nor GEMINI_API_KEY is set — Nebula cannot forge new problems."
          fi
          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_KEY" ]; then
            echo "::warning title=No Kaggle credentials::KAGGLE_USERNAME / KAGGLE_KEY not set — the weekly scout cannot fetch new datasets."
          fi
          if [ -n "$RESEND_API_KEY" ] && [ -z "$APP_URL" ]; then
            echo "::warning title=No APP_URL::RESEND_API_KEY is set but APP_URL is not — links in Nebula emails would point to http://localhost:5173. Add a repository secret APP_URL with your public site URL."
          fi
          exit $missing
      # v5 majors run on Node.js 24 (v4 targeted the deprecated Node.js 20 runtime)
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      # --prod=false: NODE_ENV=production (job env above) makes pnpm skip devDependencies,
      # but the tests and CLIs need them (tsx, typescript, the engine's PGlite) — same as render.yaml
      - run: pnpm install --frozen-lockfile --prod=false
      - name: Engine tests
        run: pnpm test
      - name: Verify curated bank
        run: pnpm --filter @querion/api exec tsx src/cli/check.ts
      - name: Run Nebula
        run: |
          JOB="${{ github.event.inputs.job }}"
          if [ -z "$JOB" ]; then
            if [ "${{ github.event.schedule }}" = "0 18 * * 0" ]; then JOB=weekly; else JOB=daily; fi
          fi
          echo "Running Nebula job: $JOB"
          pnpm --filter @querion/api exec tsx src/cli/nebula.ts "$JOB"
